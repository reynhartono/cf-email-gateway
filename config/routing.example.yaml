# cf-email-gateway routing config (example)
# Copy to config/routing.local.yaml (gitignored) and put contents in wrangler
# secret ROUTING_YAML (or .dev.vars for local). Docs/copy-paste only — the
# Worker never imports this file; missing secret fails closed (Q41).
# Format: YAML 1.2 — comments allowed.
#
# Merge order at runtime:
#   defaults.*  ←  domains.<apex>.*  ←  rule / destination overrides
# Inbound delivery is always cf_forward (optional X-CFEG reply tokens).
# domains.*.send_as.enabled gates outbound compose / send-proxy / reply-hop From.
#
# Retention / auto-purge: NOT in v1. Data kept until manual delete.

version: 1

# Fallback when no rule matches. Omit for ingest-only on unmatched mail.
default_inbox: me@gmail.com

archive:
  # When true: try R2 every run until stored; still deliver same run;
  # Worker SUCCESS only if archive_ok AND required dests succeeded (B9).
  enabled: true

compose:
  default_from: me@example.com

# Mint r+ tokens + X-CFEG-* on every cf_forward (browser extension reads these)
reply_tokens:
  enabled: true

defaults:
  provider: smtp
  send_as:
    # false → inbound stays cf_forward (recommended)
    # true  → allows outbound From on domains that enable send_as
    enabled: false
    multiparty: true
  reply_as: {}

# Who may use r+ reply hop and send-proxy (Gmail From + CF auth evidence).
# Prefer identities[] for multi-person ACL (docs/20); this list still merges in.
token_auth:
  authorized_from:
    - me@gmail.com
  # - other@gmail.com

# Optional multi-person ACL (compose From + reply hop our_mailbox + send-proxy alias).
# When non-empty: each sender/bearer is bound to can_send_as prefixes.
# identities:
#   - id: alice
#     authorized_from: [alice@gmail.com]
#     compose_bearer: "replace-me-alice"
#     can_send_as:
#       - { type: local_part_prefix, value: "alice.", domain: example.com }
#   - id: operator
#     authorized_from: [me@gmail.com]
#     unrestricted: true   # COMPOSE_API_TOKEN maps here

# Per receiving apex. Unlisted domains still use the gateway + defaults.
# Enable send_as for outbound From / send-proxy / reply hop on that apex.
domains:
  example.com:
    send_as:
      enabled: true
    reply_as: {}
    # display_name: Example Co   # Q42 domain default From when no rule name

  other.example:
    send_as:
      enabled: true
      domain: example.com  # hello@other.example → From hello@example.com
    reply_as:
      domain: example.com

  forward-only.example:
    send_as:
      enabled: false
    reply_as:
      enabled: false

# Optional routes. Match tiers: address → local_part_prefix → catch_all → default_inbox.
# default_inbox is always added on rule match unless skip_default_inbox: true.
# Multi-person privacy: person rules should set skip_default_inbox: true (see docs/19).
# Q42: optional display_name on address or local_part_prefix rules; else
# domains.<apex>.display_name / defaults.display_name. All optional.
# Used as MIME From on send-proxy without braces and on reply hop.
# Explicit send-proxy {braces} still win. Compose HTTP keeps optional from_name.
rules:
  - id: billing
    match:
      type: address  # address | local_part_prefix | catch_all
      value: billing@example.com
    # display_name: Billing
    destinations:
      - email: finance@gmail.com

  # Person namespace: alice.<anything>@example.com → Alice only (not operator default_inbox)
  - id: alice-ns
    skip_default_inbox: true
    match:
      type: local_part_prefix
      value: "alice."
      domain: example.com
    # display_name: Alice
    destinations:
      - email: alice@gmail.com

  - id: bob-ns
    skip_default_inbox: true
    match:
      type: local_part_prefix
      value: "bob."
      domain: example.com
    destinations:
      - email: bob@gmail.com

  - id: catch-example
    match:
      type: catch_all
    destinations:
      - email: me@gmail.com
