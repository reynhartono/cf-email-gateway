name: ci

on:
  pull_request:
    # Code changes only — not labels, assignees, or review requests.
    # ready_for_review covers draft → ready (no push fires there, and
    # check is a required status gate, so the transition must run CI).
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

# One branch = one run; a new push cancels the stale run instead of
# queueing behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: lockfile + docs-reminder steps diff against the base.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Syntax check
        # -n1: node --check reads only the first file arg, so each file
        # gets its own invocation. Parens keep the -o alternation explicit.
        run: find src scripts \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check

      - name: Unit tests
        # Quoted glob: node expands it internally, so npm test runs the full
        # suite on every shell (the unquoted form depends on shell globstar).
        run: npm test

      - name: Routing example validation
        if: ${{ !cancelled() }}
        # Example YAML must parse under the production loader + honor the
        # no-top-level-aliases (Q42) lock. See scripts/ci-routing-lint.mjs.
        run: node scripts/ci-routing-lint.mjs

      - name: Worker dry-run
        if: ${{ !cancelled() }}
        # Placeholder-only wrangler.toml.example must still bundle.
        # Catches bad imports and entry wiring (e.g. a second /health
        # outside src/index.js, or the example YAML pulled into the bundle).
        run: |
          cp wrangler.toml.example wrangler.toml
          npx wrangler deploy --dry-run

      - name: Structural guards
        if: ${{ !cancelled() }}
        run: |
          set -e
          # Q41: runtime config is the ROUTING_YAML secret; the Worker must
          # never import the example file and there is no example fallback.
          if grep -rn "routing\.example\.yaml\|ALLOW_EXAMPLE_ROUTING" src/; then
            echo "::error::src/ must not reference the example routing file (Q41)"
            exit 1
          fi
          # GET /health is owned by src/index.js only — it reports routing_ok.
          # Same-line path + pathname pairing, so prose mentions of /health
          # (comments, docs strings) don't count, whatever the quotes.
          # Covers .js and .mjs; a route split across lines would need a
          # style change to match — the error below says where to look.
          owners=$(grep -rln --include='*.js' --include='*.mjs' -e 'pathname.*/health' -e '/health.*pathname' src/ || true)
          if [ -z "$owners" ]; then
            mentions=$(grep -rln --include='*.js' --include='*.mjs' '/health' src/ | tr '\n' ' ' || true)
            mentions="${mentions% }"
            echo "::error::/health route not found in src/ as a same-line pathname comparison (expected src/index.js; files mentioning /health: ${mentions:-none})"
            exit 1
          fi
          if [ "$owners" != "src/index.js" ]; then
            echo "::error::/health route must live in src/index.js only (found: $owners)"
            exit 1
          fi

      - name: Public hygiene
        if: ${{ !cancelled() }}
        run: |
          set -e
          tracked=$(git ls-files)
          # Local/live files are gitignored and must never be tracked.
          for p in wrangler.toml wrangler.local.toml .dev.vars .dev.vars.local \
              config/routing.yaml config/routing.local.yaml config/routing.local.yml; do
            if echo "$tracked" | grep -Fxq "$p"; then
              echo "::error::local file must not be tracked: $p"
              exit 1
            fi
          done
          if echo "$tracked" | grep -qE '\.eml$'; then
            echo "::error::real mail dumps (*.eml) must not be committed"
            exit 1
          fi
          if grep -rn --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=.wrangler \
              -E 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' .; then
            echo "::error::private key material in tree"
            exit 1
          fi

      - name: PR title convention
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$PR_TITLE" | grep -qE '^(feat|fix|docs|style|ci|chore|refactor|test|perf|build|revert)(\(.+\))?!?: .+' \
            || { echo "::error::PR title must follow Conventional Commits (e.g. 'ci: add PR checks')"; exit 1; }

      - name: Lockfile churn guard
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$base...HEAD" -- package-lock.json | grep -q .; then
            if ! git diff --name-only "$base...HEAD" -- package.json | grep -q .; then
              echo "::error::package-lock.json changed without package.json — restore it unless deps intentionally changed"
              exit 1
            fi
          fi

      - name: Docs contract reminders
        # Non-blocking: auth-gate and SMTP mapping changes should travel
        # with their contract docs + regression tests.
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          changed=$(git diff --name-only "$base...HEAD")
          if echo "$changed" | grep -qE '^src/(reply_tokens|pipeline|identity)\.js$'; then
            echo "$changed" | grep -qx 'docs/13-delivery-and-reply.md' \
              || echo "::warning::reply/auth-gate change without docs/13-delivery-and-reply.md"
          fi
          if echo "$changed" | grep -qE '^src/providers/smtp\.js$'; then
            echo "$changed" | grep -qx 'docs/12-providers.md' \
              || echo "::warning::SMTP mapping change without docs/12-providers.md"
          fi
          if echo "$changed" | grep -qx 'src/send_proxy.js'; then
            echo "$changed" | grep -qx 'docs/17-send-proxy.md' \
              || echo "::warning::send-proxy change without docs/17-send-proxy.md"
          fi
          if echo "$changed" | grep -qx 'src/compose.js'; then
            echo "$changed" | grep -qx 'docs/06-ops.md' \
              || echo "::warning::compose change without docs/06-ops.md"
          fi
